<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Toggle</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, sans-serif;
      background: #eef2f7;
      color: #18212f;
    }

    body {
      display: grid;
      min-height: 100vh;
      margin: 0;
      place-items: center;
    }

    .form-card {
      width: min(100% - 2rem, 24rem);
      padding: 2rem;
      border: 1px solid #d9e0ea;
      border-radius: 0.75rem;
      background: #ffffff;
      box-shadow: 0 0.75rem 2rem rgb(24 33 47 / 10%);
    }

    h1 {
      margin-top: 0;
      font-size: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 700;
    }

    .password-row {
      display: flex;
      gap: 0.5rem;
    }

    input,
    button {
      min-height: 2.75rem;
      box-sizing: border-box;
      border: 1px solid #aeb9c8;
      border-radius: 0.375rem;
      font: inherit;
    }

    input {
      width: 100%;
      padding: 0 0.75rem;
    }

    button {
      padding: 0 0.875rem;
      cursor: pointer;
      background: #ffffff;
      color: #18212f;
    }

    button:hover,
    button:focus-visible {
      border-color: #2457a6;
    }

    .submit-button {
      width: 100%;
      margin-top: 1.25rem;
      border-color: #2457a6;
      background: #2457a6;
      color: #ffffff;
    }

    .submit-button:hover,
    .submit-button:focus-visible {
      background: #1b4383;
      color: #ffffff;
    }

    #form-message {
      min-height: 1.25rem;
      margin: 1rem 0 0;
      color: #2457a6;
    }
  </style>
</head>
<body>
  <main class="form-card">
    <h1>Create your password</h1>
    <form id="password-form">
      <label for="password">Password</label>
      <div class="password-row">
        <input id="password" name="password" type="password" autocomplete="new-password" required>
        <button id="toggle-password" type="button" aria-controls="password" aria-pressed="false">Show</button>
      </div>
      <button class="submit-button" type="submit">Submit</button>
      <p id="form-message" role="status" aria-live="polite"></p>
    </form>
  </main>

  <script>
    const passwordInput = document.querySelector('#password');
    const toggleButton = document.querySelector('#toggle-password');
    const passwordForm = document.querySelector('#password-form');
    const formMessage = document.querySelector('#form-message');

    toggleButton.addEventListener('click', () => {
      const isVisible = passwordInput.type === 'text';
      passwordInput.type = isVisible ? 'password' : 'text';
      toggleButton.textContent = isVisible ? 'Show' : 'Hide';
      toggleButton.setAttribute('aria-pressed', String(!isVisible));
    });

    passwordForm.addEventListener('submit', (event) => {
      event.preventDefault();
      formMessage.textContent = 'Password is ready to submit.';
    });
  </script>
</body>
</html>
