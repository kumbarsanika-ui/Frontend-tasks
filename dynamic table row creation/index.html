<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Dynamic Table Rows</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #1f2937;
			background: #f4f7fb;
		}

		body {
			margin: 0;
			padding: 2rem 1rem;
		}

		.page {
			width: min(100%, 58rem);
			margin: 0 auto;
		}

		h1 {
			margin: 0 0 0.5rem;
			color: #14213d;
		}

		.intro {
			margin: 0 0 1.5rem;
			color: #526174;
		}

		.entry-form,
		.table-wrapper {
			border: 1px solid #d9e2ef;
			border-radius: 0.75rem;
			background: #ffffff;
			box-shadow: 0 0.75rem 2rem rgb(20 33 61 / 8%);
		}

		.entry-form {
			display: grid;
			grid-template-columns: repeat(3, 1fr) auto;
			gap: 1rem;
			align-items: end;
			padding: 1.25rem;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-weight: 700;
		}

		input,
		select,
		button {
			min-height: 2.75rem;
			box-sizing: border-box;
			border: 1px solid #b7c4d5;
			border-radius: 0.375rem;
			font: inherit;
		}

		input,
		select {
			width: 100%;
			padding: 0 0.75rem;
			color: #1f2937;
			background: #ffffff;
		}

		button {
			padding: 0 1rem;
			border-color: #1f6f8b;
			cursor: pointer;
			background: #1f6f8b;
			color: #ffffff;
			font-weight: 700;
		}

		button:hover,
		button:focus-visible {
			background: #18566b;
		}

		.table-wrapper {
			margin-top: 1.5rem;
			overflow-x: auto;
		}

		table {
			width: 100%;
			border-collapse: collapse;
			text-align: left;
		}

		caption {
			padding: 1.25rem 1.25rem 0.75rem;
			color: #14213d;
			font-size: 1.1rem;
			font-weight: 700;
			text-align: left;
		}

		th,
		td {
			padding: 0.875rem 1.25rem;
			border-top: 1px solid #e4eaf2;
			white-space: nowrap;
		}

		th {
			color: #526174;
			font-size: 0.85rem;
			letter-spacing: 0.03em;
			text-transform: uppercase;
		}

		tbody tr:nth-child(even) {
			background: #f8fafc;
		}

		@media (max-width: 700px) {
			.entry-form {
				grid-template-columns: 1fr;
			}
		}
	</style>
</head>
<body>
	<main class="page">
		<h1>Team directory</h1>
		<p class="intro">Add a person to the table using the form below.</p>

		<form class="entry-form" id="entry-form">
			<label for="name">
				Name
				<input id="name" name="name" type="text" required>
			</label>
			<label for="email">
				Email
				<input id="email" name="email" type="email" required>
			</label>
			<label for="role">
				Role
				<select id="role" name="role" required>
					<option value="">Choose a role</option>
					<option>Designer</option>
					<option>Developer</option>
					<option>Manager</option>
				</select>
			</label>
			<button type="submit">Add row</button>
		</form>

		<div class="table-wrapper">
			<table>
				<caption>People</caption>
				<thead>
					<tr>
						<th scope="col">Name</th>
						<th scope="col">Email</th>
						<th scope="col">Role</th>
					</tr>
				</thead>
				<tbody id="table-body">
					<tr>
						<td>Alex Morgan</td>
						<td>alex@example.com</td>
						<td>Developer</td>
					</tr>
				</tbody>
			</table>
		</div>
	</main>

	<script>
		const entryForm = document.querySelector('#entry-form');
		const tableBody = document.querySelector('#table-body');

		entryForm.addEventListener('submit', (event) => {
			event.preventDefault();

			const formData = new FormData(entryForm);
			const row = document.createElement('tr');

			['name', 'email', 'role'].forEach((fieldName) => {
				const cell = document.createElement('td');
				cell.textContent = formData.get(fieldName);
				row.appendChild(cell);
			});

			tableBody.appendChild(row);
			entryForm.reset();
			document.querySelector('#name').focus();
		});
	</script>
</body>
</html>
