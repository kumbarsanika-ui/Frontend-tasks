<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Saved Form Draft</title>
	<style>
		:root {
			font-family: Arial, sans-serif;
			color: #202a36;
			background: #edf3f1;
		}

		body {
			display: grid;
			min-height: 100vh;
			margin: 0;
			padding: 1rem;
			box-sizing: border-box;
			place-items: center;
		}

		.card {
			width: min(100%, 32rem);
			padding: 2rem;
			border: 1px solid #d0dfda;
			border-radius: 0.75rem;
			background: #ffffff;
			box-shadow: 0 1rem 2rem rgb(32 42 54 / 10%);
		}

		h1 {
			margin: 0 0 0.5rem;
			color: #173f35;
		}

		.description {
			margin: 0 0 1.5rem;
			color: #5a6c67;
			line-height: 1.5;
		}

		form {
			display: grid;
			gap: 1rem;
		}

		label {
			display: grid;
			gap: 0.4rem;
			font-weight: 700;
		}

		input,
		textarea,
		select,
		button {
			box-sizing: border-box;
			min-height: 2.75rem;
			border: 1px solid #afc1bb;
			border-radius: 0.375rem;
			font: inherit;
		}

		input,
		textarea,
		select {
			width: 100%;
			padding: 0.7rem 0.75rem;
			color: #202a36;
			background: #ffffff;
		}

		textarea {
			min-height: 7rem;
			resize: vertical;
		}

		.checkbox-label {
			display: flex;
			align-items: center;
			gap: 0.6rem;
		}

		.checkbox-label input {
			width: 1.1rem;
			min-height: 1.1rem;
			accent-color: #24735d;
		}

		.actions {
			display: flex;
			gap: 0.75rem;
			flex-wrap: wrap;
		}

		button {
			padding: 0 1rem;
			border-color: #24735d;
			cursor: pointer;
			background: #24735d;
			color: #ffffff;
			font-weight: 700;
		}

		button:hover,
		button:focus-visible {
			background: #1b5948;
		}

		.secondary-button {
			border-color: #afc1bb;
			background: #ffffff;
			color: #24735d;
		}

		.secondary-button:hover,
		.secondary-button:focus-visible {
			background: #edf3f1;
		}

		#status {
			min-height: 1.25rem;
			margin: 0.25rem 0 0;
			color: #24735d;
		}
	</style>
</head>
<body>
	<main class="card">
		<h1>Profile details</h1>
		<p class="description">Your draft is saved automatically in this browser as you type.</p>

		<form id="profile-form">
			<label for="full-name">
				Full name
				<input id="full-name" name="fullName" type="text" autocomplete="name" required>
			</label>

			<label for="email">
				Email address
				<input id="email" name="email" type="email" autocomplete="email" required>
			</label>

			<label for="bio">
				Short bio
				<textarea id="bio" name="bio"></textarea>
			</label>

			<label class="checkbox-label" for="updates">
				<input id="updates" name="updates" type="checkbox">
				Receive occasional updates
			</label>

			<div class="actions">
				<button type="submit">Save profile</button>
				<button class="secondary-button" id="clear-draft" type="button">Clear saved draft</button>
			</div>
			<p id="status" role="status" aria-live="polite"></p>
		</form>
	</main>

	<script>
		function saveFormToLocalStorage(form, storageKey) {
			const fields = [...form.elements].filter((field) => field.name);

			const restoreForm = () => {
				const savedData = localStorage.getItem(storageKey);
				if (!savedData) return false;

				const values = JSON.parse(savedData);
				fields.forEach((field) => {
					if (!(field.name in values)) return;
					field.type === 'checkbox'
						? field.checked = values[field.name]
						: field.value = values[field.name];
				});
				return true;
			};

			const saveForm = () => {
				const values = Object.fromEntries(fields.map((field) => [
					field.name,
					field.type === 'checkbox' ? field.checked : field.value
				]));
				localStorage.setItem(storageKey, JSON.stringify(values));
			};

			const clearSavedForm = () => {
				localStorage.removeItem(storageKey);
				form.reset();
			};

			fields.forEach((field) => field.addEventListener('input', saveForm));
			fields.forEach((field) => field.addEventListener('change', saveForm));

			return { restoreForm, saveForm, clearSavedForm };
		}

		const profileForm = document.querySelector('#profile-form');
		const status = document.querySelector('#status');
		const savedForm = saveFormToLocalStorage(profileForm, 'profile-draft');

		if (savedForm.restoreForm()) {
			status.textContent = 'Saved draft restored.';
		}

		profileForm.addEventListener('submit', (event) => {
			event.preventDefault();
			savedForm.saveForm();
			status.textContent = 'Profile saved in this browser.';
		});

		document.querySelector('#clear-draft').addEventListener('click', () => {
			savedForm.clearSavedForm();
			status.textContent = 'Saved draft cleared.';
		});
	</script>
</body>
</html>
